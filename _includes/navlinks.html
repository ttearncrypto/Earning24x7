<hr>
<div class="post_navi">
  {%- if page.previous.url -%}
  <a class="post_navi-item nav_prev" href="{{ page.previous.url | absolute_url }}" title="{{ page.previous.title }}">
    <div class="post_navi-label"><span class="post_navi-arrow"><i data-lucide="arrow-left" style="width:14px;height:14px"></i></span> Previous Post</div><div><span>{{ page.previous.title }}</span></div>
  </a>
  {%- else -%}
  <a class="post_navi-item nav_prev" href="{{ 'archive.html' | absolute_url }}" title="Blog Archive">
    <div class="post_navi-label"><span class="post_navi-arrow"><i data-lucide="arrow-left" style="width:14px;height:14px"></i></span> Blog Archive</div><div><span>Archive of all previous blog posts</span></div>
  </a>
  {%- endif -%}
  {%- if page.next.url -%}
  <a class="post_navi-item nav_next" href="{{ page.next.url | absolute_url }}" title="{{ page.next.title }}">
    <div class="post_navi-label">Next Post <span class="post_navi-arrow"><i data-lucide="arrow-right" style="width:14px;height:14px"></i></span></div><div><span>{{ page.next.title }}</span></div>
  </a>
  {%- else -%}
  <a class="post_navi-item nav_next" href="{{ 'archive.html' | absolute_url }}" title="Blog Archive">
    <div class="post_navi-label">Blog Archive <span class="post_navi-arrow"><i data-lucide="arrow-right" style="width:14px;height:14px"></i></span></div><div><span>Archive of all previous blog posts</span></div>
  </a>
  {%- endif -%}
</div>
