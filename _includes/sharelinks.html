<script>
(function () {
  var buttons = document.querySelectorAll('#share-buttons [data-share]');
  buttons.forEach(function (btn) {
    function share() {
      var url = btn.getAttribute('data-url');
      var text = btn.getAttribute('data-text') || '';
      var via = btn.getAttribute('data-via') || '';
      var title = btn.getAttribute('data-title') || '';
      var fullUrl = decodeURIComponent(url);
      var fullText = decodeURIComponent(text);
      var fullTitle = decodeURIComponent(title);
      var shareUrl = '';
      switch (btn.getAttribute('data-share')) {
        case 'facebook':
          shareUrl = 'https://www.facebook.com/share.php?u=' + encodeURIComponent(fullUrl);
          break;
        case 'twitter':
          shareUrl = 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(fullUrl) + '&text=' + encodeURIComponent(fullText) + (via ? '&via=' + encodeURIComponent(via) : '');
          break;
        case 'linkedin':
          shareUrl = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodeURIComponent(fullUrl);
          break;
        case 'pinterest':
          shareUrl = 'https://pinterest.com/pin/create/button/?url=' + encodeURIComponent(fullUrl) + '&description=' + encodeURIComponent(fullTitle);
          break;
        case 'mail':
          window.location.href = 'mailto:?&body=' + encodeURIComponent(fullUrl) + '&subject=' + encodeURIComponent(fullTitle);
          return;
      }
      if (shareUrl) window.open(shareUrl, 'popup', 'width=600,height=600');
    }
    btn.addEventListener('click', share);
    btn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        share();
      }
    });
  });
})();
</script>
